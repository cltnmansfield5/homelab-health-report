[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-health"
version = "0.1.0"
description = "Bounded Docker and Ubuntu diagnostics with verified Drive drops"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
homelab-health = "homelab_health.__main__:main"

[tool.setuptools.packages.find]
include = ["homelab_health*"]
